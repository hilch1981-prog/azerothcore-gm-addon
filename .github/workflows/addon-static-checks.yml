name: Addon static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          temp_file="$(mktemp --suffix=.lua)"
          trap 'rm -f "$temp_file"' EXIT
          while IFS= read -r -d '' file; do
            sed $'1s/^\xEF\xBB\xBF//' "$file" > "$temp_file"
            if ! luac5.1 -p "$temp_file"; then
              echo "Lua 5.1 syntax failure: $file"
              exit 1
            fi
          done < <(find AzerothAdmin -type f -name '*.lua' -print0)

      - name: Check TOC paths
        shell: bash
        run: |
          missing=0
          while IFS= read -r entry; do
            entry="${entry%$'\r'}"
            [[ -z "$entry" || "$entry" == \#* ]] && continue
            path="AzerothAdmin/${entry//\\//}"
            if [[ ! -f "$path" ]]; then
              echo "Missing TOC file: $entry"
              missing=1
            fi
          done < AzerothAdmin/AzerothAdmin.toc
          exit "$missing"

      - name: Reject Retail-only APIs
        shell: bash
        run: |
          if grep -RInE --include='*.lua' --include='*.xml' \
            '\b(C_Container|C_Item|ScrollBox|C_QuestLog)\b' AzerothAdmin; then
            echo 'Retail-only API detected.'
            exit 1
          fi

      - name: Validate addon structure and XML
        run: python tools/validate_addon_structure.py

      - name: Build and verify release ZIP
        run: python tools/build_release_zip.py --output "AzerothAdmin-R81-Precheck.zip"

      - name: Test Python audit tools
        run: >-
          python -m unittest
          tools/test_addon_structure.py
          tools/test_audit_command_meta.py
          tools/test_build_release_zip.py
          tools/test_craft_frame_lifecycle.py
          tools/test_featured_creature_browser.py
          tools/test_generate_quest_reward_335.py
          tools/test_party_bot_quest_sync.py
          tools/test_popup_layer_lifecycle.py
          tools/test_profession_enhancement_categories.py
          tools/test_quickslot_actions.py
          tools/test_quest_drop_source_cycle.py
          tools/test_remote_bank_flow.py
          tools/test_self_revive_flow.py

      - name: Audit AzerothCore command metadata
        run: python tools/audit_command_meta.py

      - name: Audit faction formatter tokens
        run: python tools/audit_faction_tokens.py

      - name: Upload validated addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AzerothAdmin-R81-Precheck
          path: AzerothAdmin-R81-Precheck.zip
          if-no-files-found: error
          retention-days: 14

  creature-cache-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download pinned AzerothCore creature query SQL
        shell: bash
        run: |
          set -euo pipefail
          AC_COMMIT="ca8e6d78dee182fbe4c840dbc24a577c25844593"
          BASE="https://raw.githubusercontent.com/azerothcore/azerothcore-wotlk/${AC_COMMIT}/data/sql/base/db_world"
          mkdir -p .cache-preflight
          for file in creature_template.sql creature_template_model.sql creature_questitem.sql creature_template_locale.sql; do
            curl --fail --location --retry 3 --output ".cache-preflight/${file}" "${BASE}/${file}"
            test -s ".cache-preflight/${file}"
          done

      - name: Build exact koKR creature query WDB patch
        run: >-
          python tools/build_featured_creature_cache.py
          --addon AzerothAdmin
          --template .cache-preflight/creature_template.sql
          --models .cache-preflight/creature_template_model.sql
          --questitems .cache-preflight/creature_questitem.sql
          --locale .cache-preflight/creature_template_locale.sql
          --locale-code koKR
          --output featured_creaturecache_r81.wdb

      - name: Validate WDB structure and pinned records
        run: >-
          python tools/validate_featured_creature_cache.py
          --wdb featured_creaturecache_r81.wdb
          --expected-count 414
          --expect-model 4949:4527
          --expect-model 4968:30863
          --expect-model 10181:28213
          --expect-model 10184:8570
          --expect-model 12397:12449
          --expect-model 36597:30721
          --expect-quest 10184:18705

      - name: Upload validated WDB patch
        uses: actions/upload-artifact@v4
        with:
          name: creaturecache-r81-patch
          path: featured_creaturecache_r81.wdb
          if-no-files-found: error
          retention-days: 14

  creature-cache-windows:
    needs: creature-cache-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated WDB patch
        uses: actions/download-artifact@v4
        with:
          name: creaturecache-r81-patch
          path: .cache-preflight

      - name: Create synthetic live cache with server cacheVersion
        shell: pwsh
        run: |
          python tools/test_creature_cache_merger.py create --patch .cache-preflight/featured_creaturecache_r81.wdb --target .cache-preflight/live.wdb
          Copy-Item .cache-preflight/live.wdb .cache-preflight/original.wdb

      - name: Run real PowerShell append-only merger
        shell: pwsh
        run: >-
          ./tools/client_cache_r81/Merge-CreatureCache-R81.ps1
          -TargetPath .cache-preflight/live.wdb
          -PatchPath .cache-preflight/featured_creaturecache_r81.wdb

      - name: Verify header and every existing record are byte-identical
        shell: pwsh
        run: >-
          python tools/test_creature_cache_merger.py verify
          --original .cache-preflight/original.wdb
          --merged .cache-preflight/live.wdb
          --patch .cache-preflight/featured_creaturecache_r81.wdb

      - name: Verify second merge is idempotent
        shell: pwsh
        run: |
          $before = (Get-FileHash .cache-preflight/live.wdb -Algorithm SHA256).Hash
          ./tools/client_cache_r81/Merge-CreatureCache-R81.ps1 -TargetPath .cache-preflight/live.wdb -PatchPath .cache-preflight/featured_creaturecache_r81.wdb
          $after = (Get-FileHash .cache-preflight/live.wdb -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "Second merge changed an already complete cache." }
          Write-Host "Idempotence PASS: $after"
