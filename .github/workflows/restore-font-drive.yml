name: Restore tested Unicode font from archived ZIP

on:
  push:
    branches:
      - claude/cowork-recovery-staging
    paths:
      - '.github/workflows/restore-font-drive.yml'

permissions:
  contents: write

jobs:
  restore-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archived tested ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1CZuyBGcIH_wY2qgTGHEmGiUhdPnnyCs_' \
            -o /tmp/AzerothAdmin_GPT_verified.zip
          file /tmp/AzerothAdmin_GPT_verified.zip
          unzip -t /tmp/AzerothAdmin_GPT_verified.zip >/dev/null

      - name: Extract and verify exact tested TTF
        shell: bash
        run: |
          set -euo pipefail
          unzip -p /tmp/AzerothAdmin_GPT_verified.zip AzerothAdmin/Fonts/AzerothAdminUnicode.ttf > /tmp/AzerothAdminUnicode.ttf
          echo 'f8466ffa2e6d8fbff6256716d975f856257892201e6c65c56d91620d9893ad5f  /tmp/AzerothAdminUnicode.ttf' | sha256sum -c -
          test "$(stat -c %s /tmp/AzerothAdminUnicode.ttf)" = '721024'
          test "$(git hash-object /tmp/AzerothAdminUnicode.ttf)" = '8a307cb6dc84a8ed4d4772465f01bce65bb9ecb6'

      - name: Commit verified font to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin claude/cowork-recovery
          git checkout -B claude/cowork-recovery origin/claude/cowork-recovery
          mkdir -p AzerothAdmin/Fonts
          cp /tmp/AzerothAdminUnicode.ttf AzerothAdmin/Fonts/AzerothAdminUnicode.ttf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AzerothAdmin/Fonts/AzerothAdminUnicode.ttf
          if git diff --cached --quiet; then
            echo 'Verified font already present.'
            exit 0
          fi
          git commit -m 'Add verified Unicode font asset'
          git push origin HEAD:claude/cowork-recovery
